{% extends "base.html" %}
{% block title %}Reports · Fresh Market{% endblock %}
{% block main %}
<div class="head-row">
  <h1>Reports</h1>
  <label>Period <select id="days"><option value="7">Last 7 days</option><option value="14">Last 14 days</option><option value="30">Last 30 days</option></select></label>
</div>
<div class="report-grid">
  <section class="panel"><h2>Revenue by category</h2><div id="revenue"></div><details><summary>SQL</summary><pre id="sql-revenue"></pre></details></section>
  <section class="panel"><h2>Top products</h2><div id="top"></div><details><summary>SQL</summary><pre id="sql-top"></pre></details></section>
  <section class="panel"><h2>Low stock</h2><div id="low"></div><details><summary>SQL</summary><pre id="sql-low"></pre></details></section>
  <section class="panel"><h2>Orders by status</h2><div id="statuses"></div><details><summary>SQL</summary><pre id="sql-status"></pre></details></section>
</div>
<p class="muted small">Revenue counts the price each item sold for, and leaves out cancelled orders.</p>
{% endblock %}
