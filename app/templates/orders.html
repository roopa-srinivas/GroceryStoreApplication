{% extends "base.html" %}
{% block title %}Orders · Fresh Market{% endblock %}
{% block main %}
<h1>Orders</h1>
<div class="chips" id="status-filter" role="group" aria-label="Status"></div>
<div class="table-wrap">
  <table>
    <thead><tr><th>Order</th><th>Customer</th><th>Items</th><th class="num">Total</th><th>Placed</th><th>Status</th><th></th></tr></thead>
    <tbody id="orders"></tbody>
  </table>
</div>
<p class="muted small">Processing orders can ship or be cancelled (which restocks their items); shipped orders can be delivered.</p>
{% endblock %}
