<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{% block title %}Fresh Market{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
</head>
<body data-page="{{ active }}">
<header class="bar">
  <a class="brand" href="{{ url_for('views.store') }}">🛒 Fresh Market</a>
  <nav aria-label="Main">
    <a href="{{ url_for('views.store') }}" {% if active == 'store' %}aria-current="page"{% endif %}>Shop</a>
    <span class="nav-sep" aria-hidden="true">Manager:</span>
    <a href="{{ url_for('views.orders') }}" {% if active == 'orders' %}aria-current="page"{% endif %}>Orders</a>
    <a href="{{ url_for('views.inventory') }}" {% if active == 'inventory' %}aria-current="page"{% endif %}>Inventory</a>
    <a href="{{ url_for('views.reports') }}" {% if active == 'reports' %}aria-current="page"{% endif %}>Reports</a>
  </nav>
</header>
<main>{% block main %}{% endblock %}</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
